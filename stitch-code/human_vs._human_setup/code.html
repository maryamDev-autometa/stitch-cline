<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Knight AI - New Game Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#135bec",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              display: ["Space Grotesk", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
<style>
      .form-radio:checked {
        background-color: #135bec;
        border-color: #135bec;
      }
      .form-radio:checked:hover {
        background-color: #135bec;
        border-color: #135bec;
      }
      .player-card {
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }
      .player-card:hover, .player-card.focused {
        border-color: #135bec;
        box-shadow: 0 0 15px rgba(19, 91, 236, 0.5);
      }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200">
<div class="flex min-h-screen flex-col">
<header class="border-b border-slate-200/80 dark:border-slate-800/80">
<div class="mx-auto flex max-w-7xl items-center justify-between p-4">
<div class="flex items-center gap-3">
<svg class="h-8 w-8 text-slate-900 dark:text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 22a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"></path>
<path d="m15 18-3-9 2-1 2 4 4-2-1 9h-5Z"></path>
<path d="M11.95 2.13A10 10 0 0 1 20 12l-2 .5A8 8 0 0 0 6.44 5.3L5.5 3.5"></path>
</svg>
<h1 class="text-xl font-bold text-slate-900 dark:text-white">Knight AI</h1>
</div>
<div class="flex items-center gap-4">
<nav class="hidden md:flex items-center gap-6">
<a class="text-sm font-medium text-slate-600 hover:text-primary dark:text-slate-300 dark:hover:text-primary" href="#">Play</a>
<a class="text-sm font-medium text-slate-600 hover:text-primary dark:text-slate-300 dark:hover:text-primary" href="#">Puzzles</a>
<a class="text-sm font-medium text-slate-600 hover:text-primary dark:text-slate-300 dark:hover:text-primary" href="#">Learn</a>
</nav>
<img alt="User Avatar" class="h-10 w-10 rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQDjSQTv5J0h1_aUOT3WYP0h61_WAZ7RowdOLNmM-K2a7chiVGkHP8S_yjV6w6jkI-Glo_VtOHii_LN3ZE1Zj4jr92PPUFzFHK2cqZf38uM-sdIGfS5Fd9o9CPE5vhPzCB36fkPYgcXPhvFW-WpwJNWGUGQUlq2XAB7c6bcBNvaLAQvui0_RzxOIxhw9pvJVxnu2Tw16DiAopqcAjOiYmp3NZn1uwcbj4IFA4egKx6IAi8QtM0RnbPQU5_Ox7AE5vOaVK0v1APJdA"/>
</div>
</div>
</header>
<main class="flex-grow">
<div class="mx-auto max-w-4xl px-4 py-16 sm:px-6 lg:px-8">
<div class="w-full mx-auto">
<div class="text-center mb-12">
<h2 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">Human vs. Human</h2>
<p class="mt-4 text-lg text-slate-500 dark:text-slate-400">Challenge another player to a battle of wits.</p>
</div>
<form>
<div class="flex flex-col md:flex-row items-center justify-center gap-8">
<div class="player-card w-full max-w-sm rounded-xl bg-slate-900/50 p-6 text-center border-2 border-transparent hover:border-primary focus-within:border-primary focus-within:shadow-[0_0_15px_rgba(19,91,236,0.5)] transition-all duration-300">
<h3 class="text-2xl font-bold text-white mb-6">Player 1</h3>
<div class="space-y-6">
<div>
<label class="sr-only" for="player1-name">Player 1 Name</label>
<input class="block w-full rounded-lg border-0 bg-slate-800 py-3 px-4 text-white shadow-sm ring-1 ring-inset ring-slate-700 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="player1-name" name="player1-name" placeholder="Enter name or handle" type="text"/>
</div>
<fieldset>
<legend class="sr-only">Player 1 Game Mode</legend>
<div class="flex justify-center gap-4">
<label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-300 hover:text-white">
<input class="form-radio h-4 w-4 text-primary bg-slate-700 border-slate-600 focus:ring-primary" name="player1-mode" type="radio" value="local"/>
                    Local
                </label>
<label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-300 hover:text-white">
<input class="form-radio h-4 w-4 text-primary bg-slate-700 border-slate-600 focus:ring-primary" name="player1-mode" type="radio" value="online"/>
                    Online
                </label>
</div>
</fieldset>
</div>
</div>
<div class="text-5xl font-bold text-slate-500 dark:text-slate-400 my-4 md:my-0 transform md:rotate-0">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48;">swords</span>
</div>
<div class="player-card w-full max-w-sm rounded-xl bg-slate-900/50 p-6 text-center border-2 border-transparent hover:border-primary focus-within:border-primary focus-within:shadow-[0_0_15px_rgba(19,91,236,0.5)] transition-all duration-300">
<h3 class="text-2xl font-bold text-white mb-6">Player 2</h3>
<div class="space-y-6">
<div>
<label class="sr-only" for="player2-name">Player 2 Name</label>
<input class="block w-full rounded-lg border-0 bg-slate-800 py-3 px-4 text-white shadow-sm ring-1 ring-inset ring-slate-700 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="player2-name" name="player2-name" placeholder="Enter name or handle" type="text"/>
</div>
<fieldset>
<legend class="sr-only">Player 2 Game Mode</legend>
<div class="flex justify-center gap-4">
<label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-300 hover:text-white">
<input class="form-radio h-4 w-4 text-primary bg-slate-700 border-slate-600 focus:ring-primary" name="player2-mode" type="radio" value="local"/>
                    Local
                </label>
<label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-300 hover:text-white">
<input class="form-radio h-4 w-4 text-primary bg-slate-700 border-slate-600 focus:ring-primary" name="player2-mode" type="radio" value="online"/>
                    Online
                </label>
</div>
</fieldset>
</div>
</div>
</div>
<div class="mt-12">
<button class="flex w-full max-w-md mx-auto justify-center rounded-lg bg-primary px-3 py-4 text-base font-semibold leading-6 text-white shadow-lg shadow-primary/30 hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-transform transform hover:scale-105" type="submit">Start Battle</button>
</div>
</form>
</div>
</div>
</main>
</div>
<script>
    document.querySelectorAll('.player-card input, .player-card select').forEach(element => {
        element.addEventListener('focus', (e) => {
            e.target.closest('.player-card').classList.add('focused');
        });
        element.addEventListener('blur', (e) => {
            e.target.closest('.player-card').classList.remove('focused');
        });
    });
</script>
</body></html>
