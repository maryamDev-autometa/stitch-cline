<script>
                  const board = document.querySelector('.chess-board');
                  const pieces = {
                    'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
                    'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
                  };
                  const initialPosition = [
                    'r', 'n', 'b', 'q', 'k', 'b', 'n', 'r',
                    'p', 'p', 'p', 'p', 'p', 'p', 'p', 'p',
                    '', '', '', '', '', '', '', '',
                    '', '', '', '', '', '', '', '',
                    '', '', '', '', '', '', '', '',
                    '', '', '', '', '', '', '', '',
                    'P', 'P', 'P', 'P', 'P', 'P', 'P', 'P',
                    'R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R'
                  ];
                  for (let i = 0; i < 64; i++) {
                    const square = document.createElement('div');
                    const row = Math.floor(i / 8);
                    const col = i % 8;
                    const isLight = (row + col) % 2 === 0;
                    square.className = `chess-square ${isLight ? 'light' : 'dark'}`;
                    const pieceSymbol = initialPosition[i];
                    if(pieceSymbol) {
                        const piece = document.createElement('span');
                        piece.className = `chess-piece ${pieceSymbol.toLowerCase() === pieceSymbol ? 'text-gray-900 dark:text-black' : 'text-gray-100 dark:text-white'}`;
                        piece.textContent = pieces[pieceSymbol];
                        square.appendChild(piece);
                    }
                    board.appendChild(square);
                  }
                </script>
